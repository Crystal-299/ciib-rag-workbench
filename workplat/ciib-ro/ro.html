<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>CIIB · 科研总览</title>
<style>
/* ============================================================
   CIIB 科研总览（工作台内嵌页 · ciib-ro/ro.html）
   视觉语言直接沿用原工作台：绿色品牌色 / 浅底 / 圆角卡片 /
   细边框 / 轻阴影 / 紧凑字体 / 高信息密度
   入口：工作台左上角 ciib Logo（点击进入）。由 ciib-ro/ro.js 以 iframe 内嵌，
   自带全局样式所以做了样式与事件隔离；数据存在独立 key（ciib_ro_proto:v2），
   与工作台主数据 ciib2:db 互不影响。
   ============================================================ */
:root{
  --bg:#f4f6f5; --panel:#ffffff; --line:#e3e8e6; --ink:#1c2b28; --mut:#6b7f7a;
  --brand:#167c69; --brand-2:#0f5c4e; --brand-soft:#e2f1ee; --danger:#c2554f; --nav-hover:#e9f2ef;
  --ok:#167c69; --ok-bg:#f3faf8; --ok-ln:#bfe0d8;
  --warn:#a3691f; --warn-bg:#fdf9f1; --warn-ln:#ecdcb8;
  --bad:#b0433d; --bad-bg:#fdf4f3; --bad-ln:#eccac7;
  --todo:#5f5e5a; --todo-bg:#f7f7f5; --todo-ln:#e0e0da;
  --radius:12px; --shadow:0 1px 3px rgba(20,40,35,.08),0 8px 24px rgba(20,40,35,.06);
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:6px 14px;transition:.15s}
button:hover{border-color:var(--brand);color:var(--brand)}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button.primary:hover{background:var(--brand-2);color:#fff}
button.danger{color:var(--danger)} button.danger:hover{border-color:var(--danger);color:var(--danger)}
button.ghost{background:none} button.text-button{border:none;background:none;padding:2px 6px}
button.chip{padding:2px 10px;border-radius:99px;font-size:12px}
button.active{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-2)}
button.mini{padding:2px 8px;font-size:11.5px;border-radius:7px}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
input[type=checkbox],input[type=radio]{width:auto}
.muted{color:var(--mut)}

/* ---------- 多选控件：不用原生 <select multiple>（原生必须按住 Ctrl 才能加选） ---------- */
.msel{border:1px solid var(--line);border-radius:8px;background:#fff;overflow:auto;padding:4px;scrollbar-width:thin}
.msel-bar{display:flex;align-items:center;gap:9px;padding:2px 4px 5px;border-bottom:1px dashed var(--line);margin-bottom:3px;position:sticky;top:0;background:#fff;z-index:1}
.msel-bar .msel-n{font-size:11px;color:var(--mut)}
.msel-bar .msel-n b{color:var(--brand-2)}
.msel-bar button{border:none;background:none;padding:0;font-size:11px;color:var(--brand);width:auto}
.msel-bar button:hover{text-decoration:underline}
.msel-i{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:6px;font-size:12.5px;cursor:pointer;user-select:none}
.msel-i:hover{background:var(--nav-hover)}
.msel-i input{flex:none;accent-color:var(--brand)}
.msel-i.on{background:var(--brand-soft);color:var(--brand-2)}
.msel-i span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.multi-hint{font-size:11px;color:var(--mut);margin-top:2px;line-height:1.5}

/* ---------- 单选（项目标签：一个对象只能挂一个项目） ---------- */
.radios{display:flex;flex-wrap:wrap;gap:6px}
.radios label{display:flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:3px 11px;cursor:pointer;background:#fff;width:auto}
.radios label:hover{border-color:var(--brand)}
.radios label.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-2);font-weight:600}
.radios input{accent-color:var(--brand)}

/* ---------- ② 研究逻辑：分层 DAG，允许多分支并行 ---------- */
/* 阶段列头统一贴顶，节点栈在剩余高度里垂直居中 —— 这样 1 个节点的阶段
   不会孤零零挂在顶部，多分支的阶段从中间向两侧铺开，整张图看着是平的。 */
.dag{position:relative;display:flex;align-items:stretch;gap:38px;overflow-x:auto;padding:12px 2px 14px;scrollbar-width:thin;min-height:170px}
.dag-edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.dag-col{flex:none;width:156px;display:flex;flex-direction:column;gap:8px;justify-content:flex-start}
.dag-stack{flex:1;display:flex;flex-direction:column;gap:10px;justify-content:center}
.dag-col .btag{font-size:10.5px;color:var(--brand-2);background:var(--brand-soft);border-radius:99px;padding:1px 8px;align-self:flex-start;white-space:nowrap}
.dag-node{width:100%}
.dag-node .mt .lv{color:var(--brand-2)}
/* 阶段列头：阶段号 + 并行标记 + （维护模式）在本阶段加节点 */
.dag-colhead{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-height:20px}
.dag-colhead .lvtag{font-size:10.5px;color:var(--mut);letter-spacing:.3px}
.dag-colhead .plus{border:1px dashed var(--line);background:#fff;color:var(--brand);border-radius:6px;font-size:11px;
  line-height:1;padding:2px 6px;width:auto}
.dag-colhead .plus:hover{border-color:var(--brand);background:var(--brand-soft)}
.dag-empty{border:1px dashed var(--line);border-radius:9px;padding:12px 8px;font-size:11px;color:var(--mut);text-align:center}
/* 节点上的阶段调节：◂ 阶段 N ▸ + 恢复自动 */
.stgrow{display:flex;align-items:center;gap:4px;margin-top:4px;padding-top:5px;border-top:1px dashed var(--line)}
.stgbtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:1px 7px;font-size:11px;line-height:1.5;width:auto;color:var(--mut)}
.stgbtn:hover{border-color:var(--brand);color:var(--brand-2);background:var(--brand-soft)}
.stgbtn.auto{font-size:10.5px;padding:1px 5px}
.stgn{font-size:10.5px;color:var(--brand-2);min-width:26px;text-align:center}
.edrow{display:flex;gap:6px;margin-top:6px}
.edrow .mini{width:auto;padding:1px 7px;line-height:1.5}
/* 阶段快捷编辑（抽屉里那行） */
.stg-inline{margin-left:8px}

/* ---------- 导入 / 导出面板 ---------- */
.io-tip{background:var(--brand-soft);border:1px solid #a9d3c9;border-radius:10px;padding:9px 11px;font-size:12px;color:var(--brand-2);margin-bottom:12px}
.io-sec{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fff}
.io-h{font-size:12.5px;font-weight:700;color:var(--brand-2);margin-bottom:8px}
.io-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px}
.io-row:last-child{margin-bottom:0}
.io-row select{max-width:280px}
.io-note{font-size:11px;color:var(--mut);line-height:1.5}
.io-file{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--brand);background:var(--brand-soft);color:var(--brand-2);
  border-radius:8px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;width:auto}
.io-file:hover{background:#d8ece7}
.io-file input[type=file]{display:none}
.io-prev{border:1px solid var(--brand);border-radius:9px;padding:9px 11px;background:#fbfdfc;font-size:12px;margin-top:8px;line-height:1.6}
.io-prev.bad{border-color:var(--danger);background:#fdf3f2;color:#8f2c22}
.io-prev b{color:var(--brand-2)}
.io-btns{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.io-mini{margin-top:8px;border-collapse:collapse;font-size:11px;width:100%}
.io-mini th,.io-mini td{border:1px solid var(--line);padding:3px 6px;text-align:left;white-space:nowrap}
.io-mini th{background:#f6f8f7;color:var(--mut);font-weight:600}

/* ---------- 关联实验 / 文献（自动来源 + 手动关联两类） ---------- */
.lnk-grp{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.lnk-tag{flex:none;font-size:10.5px;border-radius:5px;padding:1px 6px;background:#f1f3f2;color:var(--mut);border:1px solid var(--line);margin-top:2px;white-space:nowrap}
.lnk-tag.man{background:var(--brand-soft);color:var(--brand-2);border-color:#a9d3c9}
.lnk-body{display:flex;flex-wrap:wrap;align-items:center}
.pill.lnk{cursor:pointer}
.pill.lnk:hover{border-color:var(--brand);color:var(--brand-2)}
.pill .x{margin-left:5px;color:var(--danger);font-weight:700;cursor:pointer}
.pill .x:hover{color:#b02b1f}
.emlv{font-size:10.5px;color:var(--mut);border:1px solid var(--line);border-radius:5px;padding:0 6px;white-space:nowrap}
.emlv.par{color:var(--brand-2);border-color:#a9d3c9;background:var(--brand-soft)}
.mk{font-weight:700;flex:none;width:15px;text-align:center}
.mk.ok{color:var(--ok)} .mk.warn{color:var(--warn)} .mk.bad{color:var(--bad)} .mk.todo{color:#8a8a80}

/* ---------- 顶栏 ---------- */
.ro-top{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);padding:9px 18px 0}
.ro-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ro-brand{display:flex;align-items:center;gap:9px;padding:3px 7px;border-radius:9px}
.ro-brand .lg{width:32px;height:32px;border-radius:8px;background:var(--brand);display:grid;place-items:center;flex:none}
.ro-brand .lg svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ro-brand b{font-size:19px;color:var(--brand-2);display:block;line-height:1.05}
.ro-brand small{color:var(--mut);letter-spacing:1.6px;font-size:9.5px}
/* 嵌入工作台时，左上角的 logo 由主站提供（点 logo 进来、logo 就停在原科研总览 logo 的位置），
   这里只留同宽的占位，让项目选择器仍在原来的位置。 */
.ro-slot{width:157px;height:38px;flex:none}
.ro-proj{display:flex;align-items:center;gap:8px;margin-left:4px;flex-wrap:wrap}
.ro-proj select{width:auto;min-width:186px;font-weight:600;color:var(--brand-2);background:var(--brand-soft);border-color:#a9d3c9}
.ro-updated{color:var(--mut);font-size:12px;white-space:nowrap}
.ro-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ro-tabs{display:flex;gap:2px;margin-top:7px;border-bottom:1px solid var(--line);align-items:flex-end}
.ro-tabs .ro-h1{font-size:16px;font-weight:700;margin:0 18px 8px 2px;color:var(--brand-2);white-space:nowrap}
.ro-tabs button{border:none;background:none;border-radius:0;padding:8px 14px;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.ro-tabs button:hover{color:var(--brand)}
.ro-tabs button.active{color:var(--brand-2);font-weight:700;border-bottom-color:var(--brand)}
.ro-tabs .tabs-sp{margin-left:auto;padding-bottom:6px}

/* ---------- 视图容器 ---------- */
.ro-view{padding:16px 22px 70px;max-width:1300px;margin:0 auto}
.ed-only{display:none}
.ro-view.editing .ed-only{display:inline-flex}

/* ---------- 空白状态（本页不自带数据，首次打开即此屏） ---------- */
.ro-empty{max-width:560px;margin:64px auto;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:34px 30px 28px;text-align:center}
.ro-empty .re-ico{width:52px;height:52px;border-radius:14px;background:var(--brand-soft);margin:0 auto 14px;display:grid;place-items:center}
.ro-empty .re-ico svg{width:27px;height:27px;stroke:var(--brand-2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ro-empty h2{font-size:19px;margin:0 0 9px;color:var(--text)}
.ro-empty p{margin:0 0 18px;font-size:13px;line-height:1.75;color:var(--mut)}
.ro-empty .re-btns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.ro-empty .re-tip{margin-top:18px;font-size:11.5px;line-height:1.7;color:var(--mut)}
.ro-empty code{background:var(--brand-soft);border-radius:4px;padding:1px 5px;font-size:11px;color:var(--brand-2)}

/* ---------- 区块 ---------- */
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 16px 15px;margin-bottom:13px}
.sec-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.sec-no{width:20px;height:20px;border-radius:6px;background:var(--brand-soft);color:var(--brand-2);font-size:11.5px;font-weight:700;display:grid;place-items:center;flex:none}
.sec-head h2{font-size:15px;margin:0}
.sec-head p{margin:0;font-size:12px;color:var(--mut)}
.sec-head .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.edit-flag{font-size:11px;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-ln);border-radius:99px;padding:1px 9px}

/* ---------- ① 项目状态 ---------- */
.qbox{background:#fbfdfc;border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:9px;padding:11px 14px}
.qbox .qk{font-size:11.5px;color:var(--mut);letter-spacing:.5px}
.qbox .qt{font-size:15.5px;font-weight:600;margin-top:3px;line-height:1.5}
.stat-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.proj-dates{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mut)}
.proj-dates .k{min-width:56px;color:var(--mut)}
.proj-dates .pill{margin:0}
.proj-dates .date-pill{cursor:pointer;font:inherit;font-size:11.5px}
.proj-dates .date-pill:hover{border-color:var(--brand);color:var(--brand-2);background:var(--brand-soft)}
.stat-b{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;display:flex;align-items:baseline;gap:7px;min-width:106px;text-align:left}
.stat-b b{font-size:19px;line-height:1}
.stat-b span{font-size:12px;color:var(--mut)}
.stat-b.ok{background:var(--ok-bg);border-color:var(--ok-ln)} .stat-b.ok b{color:var(--ok)}
.stat-b.warn{background:var(--warn-bg);border-color:var(--warn-ln)} .stat-b.warn b{color:var(--warn)}
.stat-b.bad{background:var(--bad-bg);border-color:var(--bad-ln)} .stat-b.bad b{color:var(--bad)}
.stat-b.todo{background:var(--todo-bg);border-color:var(--todo-ln)} .stat-b.todo b{color:var(--todo)}
.stat-b:hover{box-shadow:var(--shadow);border-color:var(--brand)}
.stat-hint{font-size:11.5px;color:var(--mut);margin-top:7px}

/* ---------- ② 研究逻辑 / Evidence Map ---------- */
.chain-wrap{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:5px 2px 8px;scrollbar-width:thin}
.lnode{flex:none;width:148px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;position:relative}
.lnode:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.lnode.sel{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.lnode .nm{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.lnode .mt{font-size:11px;color:var(--mut);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.lnode .bar{height:3px;border-radius:2px;margin-top:7px;background:var(--todo-ln)}
.lnode.ok .bar{background:var(--ok-ln)} .lnode.warn .bar{background:var(--warn-ln)} .lnode.bad .bar{background:var(--bad-ln)}
.larrow{flex:none;display:grid;place-items:center;width:26px;color:#b9c6c2;font-size:15px;user-select:none}
.chain-hint{font-size:11.5px;color:var(--mut);margin-top:2px}

/* 证据地图视图：纵向放大 + 内联详情 */
.emap{display:flex;flex-direction:column;gap:0}
.emrow{display:flex;gap:12px}
.emgutter{width:26px;flex:none;display:flex;flex-direction:column;align-items:center}
.emgutter .dot{width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid var(--todo-ln);margin-top:14px;flex:none;z-index:1}
.emrow.ok .emgutter .dot{border-color:var(--ok);background:var(--ok)}
.emrow.warn .emgutter .dot{border-color:var(--warn);background:var(--warn)}
.emrow.bad .emgutter .dot{border-color:var(--bad);background:var(--bad)}
.emgutter .line{width:2px;background:var(--line);flex:1;min-height:14px}
.emgutter .line.hide{visibility:hidden}
.embody{flex:1;min-width:0;padding-bottom:10px}
.emcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer}
.emcard:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.emcard .t{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.emcard .m{font-size:11.5px;color:var(--mut);margin-top:3px}
.emcard .gap{font-size:11.5px;color:var(--warn);margin-top:5px}
.emdetail{border:1px dashed var(--brand);border-radius:10px;background:#fbfdfc;padding:11px 13px;margin-top:8px}
.dl{display:grid;grid-template-columns:88px 1fr;gap:4px 10px;font-size:12.5px}
.dl .k{color:var(--mut)}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);background:#fbfbfa;margin:0 4px 4px 0}
.pill.ok{background:var(--ok-bg);border-color:var(--ok-ln);color:var(--ok)}
.pill.warn{background:var(--warn-bg);border-color:var(--warn-ln);color:var(--warn)}
.pill.bad{background:var(--bad-bg);border-color:var(--bad-ln);color:var(--bad)}

/* ---------- ③④ 结论 / 假设 ---------- */
.col2{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:13px}
.crow{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;cursor:pointer;background:#fff}
.crow:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.crow .txt{flex:1;min-width:0;font-size:13.5px}
.crow .sub{font-size:11.5px;color:var(--mut);margin-top:3px}
.crow .mini{margin-left:auto;flex:none}
.hchip{font:700 10.5px/1 Consolas,Menlo,monospace;background:var(--brand-soft);color:var(--brand-2);border-radius:5px;padding:4px 5px;flex:none;margin-top:1px}

/* ---------- ⑤ 关键证据 ---------- */
.ev-filters{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 12px}
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:11px}
.ev-card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;cursor:pointer;display:flex;flex-direction:column;gap:7px}
.ev-card:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.ev-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ev-name{font-weight:600;font-size:13.5px}
.ty{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.ev-find{font-size:12px;color:var(--brand-2);background:var(--brand-soft);border-radius:6px;padding:2px 8px;align-self:flex-start}
.ev-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--mut);border-top:1px dashed var(--line);padding-top:7px}
.ev-src{display:flex;align-items:center;gap:6px;min-width:0}
.ev-src .o{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref-note{font-size:11.5px;color:var(--mut);margin:0 0 12px;padding:7px 10px;background:#fbfdfc;border:1px dashed var(--line);border-radius:8px}

/* ---------- ⑥ 下一步 ---------- */
.nq{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
.nq .no{font:700 13px/1 Consolas,Menlo,monospace;color:var(--brand);background:var(--brand-soft);border-radius:7px;padding:5px 7px;flex:none}
.nq .body{flex:1;min-width:0}
.nq .t{font-size:13.5px}
.nq .why{font-size:11.5px;color:var(--mut);margin-top:3px}

/* ---------- 模块优先选择器（先选模块 → 再看模块内卡片标题） ----------

/* ============================================================================
   靛蓝配色（html.theme-ink）—— 与主工作台 style.css 的 theme-ink 同源：
   primary #1c528d / secondary #8d561c / background #c7d8eb / accent #6a4115 / text #272e35

<script>
/* ==========================================================================
   CIIB 科研总览（工作台内嵌页 · ciib-ro/ro.html）
   入口：工作台左上角 ciib Logo（点击进入）。由 ciib-ro/ro.js 以 iframe 内嵌，
   这层 iframe 同时负责样式/事件隔离与配色推送。
   本页不内置任何数据：首次打开为空，需自己新建项目或导入 JSON 数据包。
   数据写入独立 key：ciib_ro_proto:v3（旧 key v2 的示例数据启动时自动清除）
   绝不读取 / 写入原工作台数据（ciib2:db）
   ========================================================================== */
(function(){
'use strict';

var LS_KEY   = 'ciib_ro_proto:v3';
var OLD_KEYS = ['ciib_ro_proto:v2', 'ciib_ro_proto:theme'];
/* 今天是渲染时的真实日期（不写死）：起止时间的天数、新建记录的默认日期都用它 */
function pad2(n){ return n<10 ? ('0'+n) : String(n); }
function todayISO(){
  var d=new Date();
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
var TODAY    = todayISO();

/* 是否被主站以 iframe 嵌入（嵌入时左上角 logo 由主站提供、配色由主站推送） */
var EMBEDDED = (function(){ try{ return window.self !== window.top; }catch(e){ return true; } })();

/* ---------------- 小工具 ---------------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function uid(p){ return (p||'x')+'_'+Math.random().toString(36).slice(2,8); }
function byId(a,id){ a=a||[]; for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null; }
function items(a,idsArr){ var out=[]; (idsArr||[]).forEach(function(id){ var x=byId(a,id); if(x) out.push(x); }); return out; }
function uniq(a){ var o={},r=[]; (a||[]).forEach(function(x){ if(!o[x]){o[x]=1;r.push(x);} }); return r; }
/* 完成 / 归档态统一沉底：稳定分区 —— 未完成的保持原相对顺序，已完成的整体挪到最后。
   列表里凡是「勾选后置灰」的条目都走这里，勾上即自动落到最下方。 */
function sinkDone(arr, isDone){
  var a=arr||[], open=[], done=[];
  a.forEach(function(x){ (isDone(x)?done:open).push(x); });
  return open.concat(done);
}
/* 各集合的「已完成 / 已归档」判定。
   只认「完成态」的勾选与状态（已完成 / 已归档），不动结论、假设这类
   本身有叙事顺序的列表 —— 那些按 id 顺序读下来才是逻辑链。 */
var DONE_OF = {
  nextQuestions: function(q){ return !!q.done; },
  contents:      function(c){ var s=ctState(c); return s==='已完成' || s==='已归档'; }
};
function sinkBy(coll, arr){ var f=DONE_OF[coll]; return f? sinkDone(arr, f) : (arr||[]); }
function mmdd(d){ return String(d||'').slice(5).replace('-','/'); }
function daysAgo(d){
  var a=Date.parse(String(d)+'T00:00:00Z'), b=Date.parse(TODAY+'T00:00:00Z');
  if(isNaN(a)) return 1e9; return Math.round((b-a)/86400000);
}

/* ---------------- 状态元信息 ---------------- */
var RQ_STATE = { '已解决':{m:'✓',cls:'ok'}, '验证中':{m:'◐',cls:'warn'}, '待解决':{m:'?',cls:'todo'}, '已排除':{m:'×',cls:'bad'} };
var RQ_ORDER = ['已解决','验证中','已排除','待解决'];
var NODE_STATE = {
  'done':{m:'✓',cls:'ok',label:'已建立'},
  'verifying':{m:'◐',cls:'warn',label:'验证中'},
  'pending':{m:'?',cls:'todo',label:'尚未解决'},
  'excluded':{m:'×',cls:'bad',label:'已排除'}
};
var HYP_STATE = { '待验证':{m:'○',cls:'todo'}, '验证中':{m:'◐',cls:'warn'}, '已支持':{m:'✓',cls:'ok'}, '部分支持':{m:'◐',cls:'warn'}, '已排除':{m:'×',cls:'bad'} };
var EV_STATE  = { '支持':{m:'✓',cls:'ok'}, '验证中':{m:'◐',cls:'warn'}, '分析中':{m:'◐',cls:'warn'}, '待验证':{m:'○',cls:'todo'}, '反对':{m:'×',cls:'bad'} };
var TYPE_OPTIONS = ['遗传','表达','结构','分子','功能','驯化','算法','数据','评估','其他'];
var TYPE_COLOR = {
  '遗传':'#167c69','表达':'#4f8ca8','结构':'#5984c6','分子':'#a775b7','功能':'#d88b4b',
  '驯化':'#729d51','算法':'#5a67c9','数据':'#7fae62','评估':'#cc6574','其他':'#6b7f7a'
};
/* 来源模块：能当「课题来源」的模块（k = contents.modKey）。
   Todo / 科研绘图 / 实用功能不作为来源页签：前两者是日常事务、后两者不落库，
   都不该出现在证据来源里。历史已绑定这三类的条目仍能正常显示名称（见 SRC_LABEL_EXTRA）。 */
var SRC_MODULES = [
  { k:'exp',     n:'实验记录' },
  { k:'lit',     n:'文献' },
  { k:'kb',      n:'知识库' },
  { k:'mol',     n:'分子实验' },
  { k:'plasmid', n:'载体图谱' },
  { k:'tf',      n:'遗传转化' },
  { k:'',        n:'其他' }
];
/* 不在来源页签里、但要保证历史条目仍显示正确名称的模块 */
var SRC_LABEL_EXTRA = { plot:'科研绘图', todo:'Todo', tools:'实用功能' };
/* 「全部内容」的模块筛选：来源模块 + 本项目里确实还有条目的历史模块（如 Todo） */
function modFilterOptions(){
  var out = SRC_MODULES.filter(function(m){ return !!m.k; }).map(function(m){ return m.n; });
  var seen = {}; out.forEach(function(n){ seen[n]=1; });
  Object.keys(SRC_LABEL_EXTRA).forEach(function(k){
    var n = SRC_LABEL_EXTRA[k];
    if(!seen[n] && contentsOf(k).length) out.push(n);
  });
  return out;
}
function srcLabel(k){
  for(var i=0;i<SRC_MODULES.length;i++) if(SRC_MODULES[i].k===String(k)) return SRC_MODULES[i].n;
  if(SRC_LABEL_EXTRA[String(k)]) return SRC_LABEL_EXTRA[String(k)];
  return k||'其他';
}
function srcModKeyOf(label){
  for(var i=0;i<SRC_MODULES.length;i++) if(SRC_MODULES[i].n===String(label)) return SRC_MODULES[i].k;
  for(var k in SRC_LABEL_EXTRA) if(SRC_LABEL_EXTRA[k]===String(label)) return k;
  return '';
}
var SRC_OPTIONS = SRC_MODULES.map(function(m){ return m.n; });
/* 旧数据的来源标签 → 模块键（mock 里用过「分析 / 分子分析 / 绘图」这类写法） */
var SRC_ALIAS = { '分析':'plot', '分子分析':'mol', '绘图':'plot', '实验':'exp', '知识':'kb' };
var MODNAME = { lit:'文献', exp:'实验', kb:'知识', plot:'绘图', todo:'Todo' };

/* ==========================================================================
   工作台记录索引（只读）
   --------------------------------------------------------------------------
   嵌入工作台时，ciib-ro/ro.js 通过 postMessage 把工作台各模块的真实记录
   （标题 / 完成态 / 更新时间 / 所在子页）推进来；本页只读它，不写回。

   分工：
   · 「来源选择」直接列工作台记录 —— 所以看到的就是工作台里的内容；
   · 选中一条 = 同时把这条记录挂进当前项目（contents 里生成一条绑定条目
     srcId = 工作台记录 id、fromDb = true），全部内容页因此只包含
     「被选择进本项目的卡片」；
   · 绑定条目的标题 / 状态 / 日期永远实时取工作台的，本地不可改。
   ========================================================================== */
var RODEP = { ok:false, modules:[] };
function depMod(k){
  for(var i=0;i<RODEP.modules.length;i++) if(RODEP.modules[i].k===String(k)) return RODEP.modules[i];
  return null;
}
function depItems(k){ var m=depMod(k); return (m&&m.items)||[]; }
function depItem(k,id){
  var a=depItems(k);
  for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i];
  return null;
}
function depCount(k){ return depItems(k).length; }
function depReady(){ return !!RODEP.ok; }
function depNote(k){ var m=depMod(k); return (m&&m.note)||''; }
function hostPost(msg){
  if(!EMBEDDED) return false;
  try{ window.parent.postMessage(msg,'*'); return true; }catch(e){ return false; }
}
function reqIndex(){
  hostPost({type:'ciib-ro-want-index'});
}
/* 点「打开原记录」：回传模块 + 记录 id，由工作台切页并定位 */
function openInWorkbench(mod, id, title){
  if(!EMBEDDED){ toast('「打开原记录」在嵌入工作台时可用：单独打开本页时跳不过去'); return false; }
  if(!mod || !id){ toast('这条是本地补录的内容，工作台里没有对应记录'); return false; }
  hostPost({type:'ciib-ro-open', mod:mod, id:id});
  toast('正在工作台打开：'+srcLabel(mod)+(title?(' · '+title):''));
  return true;
}
/* ---- 绑定条目：contents → 工作台记录（实时读写都走这两个函数） ---- */
function ctBound(c){ return !!(c && c.fromDb && c.srcId); }
function ctLive(c){ return ctBound(c) ? depItem(c.modKey, c.srcId) : null; }   /* 找不到 = 工作台已删 */
function ctTitle(c){ var l=ctLive(c); return l? l.title : (c?(c.title||c.topic||c.id):''); }
function ctState(c){ var l=ctLive(c); return l? (l.state||'') : (c?(c.status||''):''); }
function ctDate(c){ var l=ctLive(c); return l? (l.date||'') : (c?(c.date||''):''); }
function ctGone(c){ return ctBound(c) && !ctLive(c); }

/* ---------- ② 研究逻辑：分层 DAG（允许多分支并行） ----------
   「阶段」怎么来的（两种，可混用）：
   ① 自动（默认）：阶段(n) = max(阶段(所有前驱)) + 1，即最长路径。
      于是「没有直接连线、又被同一批上游托起」的节点会自然落在同一列 → 这就是并行分支。
   ② 手动指定：节点字段 stg 一旦有值，该节点阶段被锁定，不再被上游推动；
      下游节点仍会按最长路径往后排。点「⟲自动」可恢复。
   想并行：把两个节点放在同一阶段且彼此不连线；想串行：从 A 拉一条线到 B。
   箭头用一层 SVG 在渲染后按真实坐标画出来（jsdom 无布局时自动跳过）。 */
function nodeLevels(){
  var ns=slice('logicNodes');
  var es=DB.logicEdges.filter(function(e){ return e.projectId===DB.meta.active; });
  var has={}, lock={}, lv={};
  ns.forEach(function(n){ has[n.id]=1; lv[n.id]=0; });
  ns.forEach(function(n){ if(n.stg!=null && +n.stg>0){ lv[n.id]=+n.stg-1; lock[n.id]=1; } });
  var changed=true, guard=0;
  while(changed && guard++<200){
    changed=false;
    es.forEach(function(e){
      if(!has[e.from]||!has[e.to]) return;
      if(lock[e.to]) return;                                   /* 手动阶段：锁定，不被上游推动 */
      if(lv[e.to] < lv[e.from]+1){ lv[e.to]=lv[e.from]+1; changed=true; }
    });
  }
  return lv;
}
function nodeAuto(n){ return !(n && n.stg!=null && +n.stg>0); }
function stageOf(n, lv){ lv=lv||nodeLevels(); return (lv[n.id]||0)+1; }
function maxStage(){ var lv=nodeLevels(), m=1; Object.keys(lv).forEach(function(k){ if(lv[k]+1>m) m=lv[k]+1; }); return m; }
function dagColumns(){
  var lv=nodeLevels(), cols={}, max=0;
  slice('logicNodes').forEach(function(n){
    var L=lv[n.id]||0; (cols[L]=cols[L]||[]).push(n); if(L>max) max=L;
  });
  Object.keys(cols).forEach(function(k){ cols[k].sort(function(a,b){ return a.order-b.order; }); });
  var out=[];
  for(var i=0;i<=max;i++) out.push({ lv:i+1, nodes:cols[i]||[] });
  /* 只读视图里隐掉中间的空阶段（阶段号仍以节点自身为准）；维护模式保留，方便看出「哪一阶段是空的」 */
  return state.edit ? out : out.filter(function(c){ return c.nodes.length>0; });
}
function sec2(){

  var body = cols.map(function(col){
    var par = col.nodes.length>1;
    var nodesHTML = col.nodes.map(function(n){
      var st=NODE_STATE[n.state]||NODE_STATE.pending;

          '<div class="stgrow" title="'+(auto?'当前为自动阶段（由连线推导）':'当前为手动指定阶段（不再被上游推动）')+'">' +
            '<button class="stgbtn" data-act="stgdec" data-id="'+n.id+'" title="提前一个阶段">◂</button>' +
            '<span class="stgn">'+(auto?'自动':'指定')+'</span>' +

        : '') +
      '</div>';
    }).join('') || '<div class="dag-empty">（本阶段暂无节点）</div>';
    return '<div class="dag-col" data-lv="'+col.lv+'">' +
      '<div class="dag-colhead"><span class="lvtag">阶段 '+col.lv+'</span>' +
        (par?'<span class="btag">并行 '+col.nodes.length+' 支</span>':'') +
        (state.edit?'<button class="plus" data-act="addnodeat" data-lv="'+col.lv+'" title="在本阶段新增节点">＋</button>':'') +

  }).join('');
  return '<section class="sec">' +
    '<div class="sec-head"><span class="sec-no">2</span><h2>研究逻辑 / Evidence Map</h2>' +
      '<p>结论是怎么一步步建立起来的 —— 同一阶段可有多条支线并行</p>' +
      '<span class="sp">'+ (state.edit?'<button class="mini" data-act="addnode">＋ 新增节点</button>':'') +'</span>' +
    '</div>' +
    '<div class="dag"><svg class="dag-edges" xmlns="http://www.w3.org/2000/svg"></svg>'+body+'</div>' +
    '<div class="chain-hint">按<b>阶段</b>从左到右排列；同一列里的多个节点就是<b>并行分支</b>，箭头表示谁支撑谁 —— 可分支、可汇合，不限于单链。' +
      (state.edit
        ? '<br><b>阶段怎么设：</b>①默认<b>自动</b>——阶段 = 最长路径（前驱阶段最大值 + 1）；②点卡片上的 <b>◂ ▸</b> <b>手动指定</b>阶段（指定后不再被上游推动，点「⟲ 自动」恢复）；③想让两条线<b>并行</b>，就让它们处在同一阶段且互相不连线；连一条箭头即变串行。'
        : '<br>点击节点查看该环节的结论、支持证据、关联实验/文献与当前缺口。进入「✎ 维护模式」可手动调阶段。') +
    '</div>' +
  '</section>';
}
function paintEdges(){
  var wrap=document.querySelector('.dag'); if(!wrap) return;
  var svg=wrap.querySelector('.dag-edges'); if(!svg) return;
  try{
    var map={};
    Array.prototype.slice.call(wrap.querySelectorAll('[data-nid]')).forEach(function(el){ map[el.dataset.nid]=el; });
    var W=wrap.scrollWidth, H=wrap.clientHeight;
    if(!W||!H){ svg.innerHTML=''; return; }
    var d='';
    DB.logicEdges.filter(function(e){ return e.projectId===DB.meta.active; }).forEach(function(ed){
      var a=map[ed.from], b=map[ed.to]; if(!a||!b) return;
      var x1=a.offsetLeft+a.offsetWidth, y1=a.offsetTop+a.offsetHeight/2;
      var x2=b.offsetLeft,                 y2=b.offsetTop+b.offsetHeight/2;
      var mx=(x1+x2)/2;
      d+='<path d="M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2+'" fill="none" stroke="#b9c6c2" stroke-width="1.4" marker-end="url(#dagArw)"/>';
    });
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.style.width=W+'px'; svg.style.height=H+'px';
    svg.innerHTML='<defs><marker id="dagArw" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto">'+
      '<path d="M0,0 L7,3.5 L0,7 z" fill="#b9c6c2"/></marker></defs>'+d;
  }catch(err){ svg.innerHTML=''; }
}

/* ---------- 关联实验 / 文献（抽屉与证据地图共用） ----------
   两类来源，界面上分开标注，避免重复计数：
   ① 自动：从本环节的「支持证据」派生 —— 取每条证据的 来源模块 + 来源编号 去重。
      只读，随证据变化自动更新，不需要单独维护。
   ② 手动：节点自身字段 expIds / litIds，是真实外键，指向本项目 contents 里的条目；
      其中绑定了工作台记录的（fromDb）再通过 srcId 指向工作台的实验记录 / 文献记录，
      点一下就能切过去。必须手动挂接，因为有些实验/文献是该环节的支撑材料但还没提炼成 Evidence。
   ---------------------------------------------------------------------- */
function nodeRefsHTML(n){
  var evs = items(slice('evidence'), n.evidenceIds);
  var seen={}, auto=[];
  evs.forEach(function(e){
    var s=evSrcText(e);
    if(!s) return;
    if(!seen[s]){ seen[s]=1; auto.push(s); }
  });
  var man = (n.expIds||[]).concat(n.litIds||[])
    .map(function(id){ return byId(DB.contents,id); }).filter(Boolean);
  var html = '<div class="lnk-grp"><span class="lnk-tag">自动</span><div class="lnk-body">' +
    (auto.length ? auto.map(function(s){
        return '<span class="pill" title="自动派生：来自该环节支持证据的来源">'+esc(s)+'</span>';
      }).join('')
      : '<span class="muted">—</span>') +
    '</div></div>';
  html += '<div class="lnk-grp"><span class="lnk-tag man">手动</span><div class="lnk-body">' +
    (man.length ? man.map(function(c){
        var tip = ctBound(c)
          ? (ctGone(c) ? '工作台里这条记录已删除' : '点击打开工作台里的原记录')
          : '本地补录：工作台里没有原记录';
        return '<span class="pill lnk" data-act="openct" data-id="'+c.id+'" title="'+esc(tip)+'">' +
          esc(modName(c.modKey))+' · '+esc(ctTitle(c)) +
          (ctBound(c) && ctGone(c) ? ' <span class="ct-src gone">已删除</span>' : '') +
          (state.edit ? '<span class="x" data-act="unlinkref" data-id="'+n.id+'" data-ref="'+c.id+'" title="解除关联（只解除关系，不删除原记录）">×</span>' : '') +
          '</span>';
      }).join('')
      : '<span class="muted">'+(state.edit?'尚未手动关联':'—')+'</span>') +
    '</div></div>';
  if(state.edit) html += '<button class="mini" data-act="linknode" data-id="'+n.id+'">＋ 关联实验 / 文献</button>';
  return html;
}

function emapHTML(){
  var cols = dagColumns(), lvOf={}, parOf={};
  cols.forEach(function(c){ c.nodes.forEach(function(n){ lvOf[n.id]=c.lv; parOf[n.id]=c.nodes.length>1; }); });
  var nodes = slice('logicNodes').sort(function(a,b){
    var d=(lvOf[a.id]||0)-(lvOf[b.id]||0); return d!==0?d:(a.order-b.order);
  });
  var body = nodes.map(function(n,i){
    var st = NODE_STATE[n.state]||NODE_STATE.pending;
    var open = state.expanded.indexOf(n.id)>=0;
    var par = !!parOf[n.id];
    return '<div class="emrow '+st.cls+'">' +
      '<div class="emgutter"><span class="dot"></span>'+(i<nodes.length-1?'<span class="line"></span>':'<span class="line hide"></span>')+'</div>' +
      '<div class="embody">' +
        '<div class="emcard" data-act="emnode" data-id="'+n.id+'">' +
          '<div class="t"><span class="mk '+st.cls+'">'+st.m+'</span>'+esc(n.name)+
            '<span class="emlv'+(par?' par':'')+'" style="margin-left:auto">阶段 '+(lvOf[n.id]||1)+(par?' · 并行':'')+(nodeAuto(n)?'':' · 指定')+'</span>'+
            '<span style="font-size:11.5px;color:var(--mut);font-weight:400">证据 '+nodeEvidenceCount(n)+' · '+st.label+'</span></div>' +
          '<div class="m">'+esc(n.note||'')+'</div>' +
          (n.gap&&n.gap.length?'<div class="gap">缺口：'+esc(n.gap.join('、'))+'</div>':'') +
        '</div>' +

  }).join('');
  return '<section class="sec">' +
    '<div class="sec-head"><span class="sec-no">◈</span><h2>证据地图 · 研究逻辑全展开</h2>' +
      '<p>按阶段排列；标「并行」的环节说明该阶段有多条支线同时推进。点击任一环节展开它的结论、证据、关联对象与缺口</p>' +

      ? ('工作台「'+esc(srcLabel(modKey))+'」里还没有记录。'+(note?('（'+esc(note)+'）'):'')+'可以先去工作台建这条记录，或选「其他」手填标题。')

/* ---- 证据表单里的「结论 / 假设 / 节点」多选：跟随所属项目 ------------------
   所属项目一改，下面三组列表立刻切到新项目的对象；原来勾中的按「名称」尽量
   保留（新项目里同名就续上，不存在就解除）。 */
function evRefHTML(pid, sel){

    '<div class="field full"><span>关联逻辑节点（多选 · 点一下即选中）</span>'+multiList(nds, sel.nd||[], 3, 'nd')+'</div>'+

}
var REF_SPEC = [['cn','conclusions','text'],['rcn','conclusions','text'],
                ['hy','hypotheses','name'],['rhy','hypotheses','name'],
                ['nd','logicNodes','name']];
function findLab(coll, pid, lab, field){
  var list=DB[coll]||[];
  for(var i=0;i<list.length;i++)
    if(list[i].projectId===pid && String(list[i][field]==null?'':list[i][field])===lab) return list[i].id;
  return '';
}
function carryRefs(box, newPid){
  var out={}, matched=0, lost=0;
  REF_SPEC.forEach(function(sp){
    var ids=getMulti(box, sp[0]);
    var next=[];
    ids.forEach(function(x){
      var o=byId(DB[sp[1]], x); if(!o) return;
      var L=String(o[sp[2]]==null?'':o[sp[2]]); if(!L) return;
      var id=findLab(sp[1], newPid, L, sp[2]);
      if(id) next.push(id); else lost++;
    });
    matched += next.length;
    out[sp[0]] = uniq(next);
  });
  out._note = (matched||lost)
    ? ('已切换到新项目：按名称自动匹配 <b>'+matched+'</b> 项'+(lost?('；另有 <b>'+lost+'</b> 项在新项目里不存在，已解除'):'')+'。保存后生效。')
    : '';
  return out;
}
function onlyPid(coll, ids, pid){
  return (ids||[]).filter(function(x){ var o=byId(DB[coll],x); return o && o.projectId===pid; });
}
function pickModKey(box, name){
  var t=box.querySelector('.modtabs[data-modtabs="'+name+'"] .modtab.on');
  return t? t.dataset.mod : '';
}

function projTag(pid){ var p=P(pid); return (p&&p.tags&&p.tags[0])||'#未归类'; }
function projRadio(pid){

    var on=x.id===pid;
    return '<label class="'+(on?'on':'')+'"><input type="radio" name="f_proj" value="'+esc(x.id)+'"'+(on?' checked':'')+'>'+
      esc((x.tags&&x.tags[0])||x.name)+'</label>';

}

/* ---- 双向同步 ----------------------------------------------------------
   规则：谁被保存，就以「谁自己声明的关联」为准，重写对方记录上的镜像字段。
   · 只增删这一条关系，绝不覆盖对方记录本身 → 两侧都可以独立编辑；
   · 解除关联 ≠ 删除记录 → 两侧都可以独立存在（例如一条证据可以不属于任何结论）。
   对应关系：
     证据.conclusionIds   ↔ 结论.evidenceIds      证据.refuteConcIds ↔ 结论.refuteIds
     证据.hypothesisIds   ↔ 假设.supportIds       证据.refuteHypIds  ↔ 假设.refuteIds
     证据.nodeIds         ↔ 节点.evidenceIds
   ---------------------------------------------------------------------- */
function relinkEvidence(eid){
  var e=byId(DB.evidence,eid); if(!e) return;
  var cn=e.conclusionIds||[], rcn=e.refuteConcIds||[], hy=e.hypothesisIds||[],
      rhy=e.refuteHypIds||[], nd=e.nodeIds||[];
  DB.conclusions.forEach(function(c){
    c.evidenceIds=(c.evidenceIds||[]).filter(function(x){ return x!==eid; });
    c.refuteIds  =(c.refuteIds||[]).filter(function(x){ return x!==eid; });
    if(cn.indexOf(c.id)>=0)  c.evidenceIds.push(eid);
    if(rcn.indexOf(c.id)>=0) c.refuteIds.push(eid);
  });
  DB.hypotheses.forEach(function(h){
    h.supportIds=(h.supportIds||[]).filter(function(x){ return x!==eid; });
    h.refuteIds =(h.refuteIds||[]).filter(function(x){ return x!==eid; });
    if(hy.indexOf(h.id)>=0)  h.supportIds.push(eid);
    if(rhy.indexOf(h.id)>=0) h.refuteIds.push(eid);
  });
  DB.logicNodes.forEach(function(n){
    n.evidenceIds=(n.evidenceIds||[]).filter(function(x){ return x!==eid; });
    if(nd.indexOf(n.id)>=0) n.evidenceIds.push(eid);
  });
}
function relinkConclusion(cid){
  var c=byId(DB.conclusions,cid); if(!c) return;
  var sup=c.evidenceIds||[], ref=c.refuteIds||[];
  DB.evidence.forEach(function(e){
    e.conclusionIds=(e.conclusionIds||[]).filter(function(x){ return x!==cid; });

function splitOn(s, re){ return String(s==null?'':s).split(re).map(function(x){ return x.trim(); }).filter(Boolean); }
function findByName(coll, key, name){
  var list=slice(coll), v=String(name==null?'':name).trim();
  if(!v) return null;
  for(var i=0;i<list.length;i++){ if(String(list[i][key]==null?'':list[i][key]).trim()===v) return list[i]; }

var NODE_STATE_ALIAS = {
  '已建立':'done','建立':'done','完成':'done','已完成':'done','done':'done',
  '验证中':'verifying','进行中':'verifying','verifying':'verifying',
  '尚未解决':'pending','待解决':'pending','未开始':'pending','pending':'pending',
  '已排除':'excluded','排除':'excluded','excluded':'excluded'
};
function nodeStateKey(s){ s=String(s==null?'':s).trim(); return (NODE_STATE[s]?s:(NODE_STATE_ALIAS[s]||'pending')); }

/* ---------- CSV 编解码 ---------- */
function csvCell(v){
  var s=(v==null?'':String(v));
  return /[",\n\r]/.test(s) ? ('"'+s.replace(/"/g,'""')+'"') : s;
}
function toCSV(head, rows){
  var out=[head.map(csvCell).join(',')];
  (rows||[]).forEach(function(r){
    var cells = (r && r.map) ? r : head.map(function(h){ return r[h]; });   /* 兼容「数组行」与「对象行」 */
    out.push(head.map(function(_,i){ return csvCell(cells[i]); }).join(','));
  });
  return out.join('\r\n');
}
function parseCSV(text){
  text=String(text==null?'':text).replace(/^\ufeff/,'');
  var rows=[], row=[], cur='', q=false, i=0, c;
  while(i<text.length){
    c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i+=2; continue; } q=false; i++; continue; }
      cur+=c; i++; continue;
    }
    if(c==='"'){ q=true; i++; continue; }
    if(c===','){ row.push(cur); cur=''; i++; continue; }
    if(c==='\r'){ i++; continue; }
    if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; i++; continue; }
    cur+=c; i++;
  }
  row.push(cur); rows.push(row);
  return rows.filter(function(r){ return r.some(function(x){ return String(x).trim()!==''; }); });
}
function csvObjects(text){
  var rows=parseCSV(text);
  if(!rows.length) return {head:[], rows:[], raw:[]};
  var head=rows[0].map(function(h){ return String(h).replace(/^\ufeff/,'').trim(); });
  var raw=rows.slice(1);
  var objs=raw.map(function(r){
    var o={}; head.forEach(function(h,j){ o[h]=String(r[j]==null?'':r[j]).trim(); }); return o;
  });
  return {head:head, rows:objs, raw:raw};
}

/* ---------- 文件下载（浏览器环境；不支持时降级） ---------- */
function downloadText(name, text, mime){
  try{
    var blob=new Blob([text], {type:(mime||'text/plain')+';charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{ URL.revokeObjectURL(url); a.parentNode&&a.parentNode.removeChild(a); }catch(e){} }, 500);
    return true;
  }catch(err){
    try{
      var w=window.open('','_blank');
      if(w){ w.document.write('<pre style="white-space:pre-wrap">'+esc(text)+'</pre>'); return true; }
    }catch(e2){}
    toast('当前环境不支持直接下载，内容已输出到控制台');
    try{ console.log(name, text); }catch(e3){}
    return false;
  }
}

function ioTable(key){
  for(var i=0;i<IO_TABLES.length;i++) if(IO_TABLES[i].key===key) return IO_TABLES[i];
  return null;
}
/* 表头识别：必须包含目标表的「全部列名」（顺序可不同、可多加列），
   避免只给一两列就被猜成某张表、导出错数据。 */
function detectTable(head){
  var H=(head||[]).map(function(h){ return String(h).replace(/\s/g,''); });
  if(H.length<2) return null;
  /* 总表：第一列是「表类型」，一眼认出，不再往下猜 */
  if(H.indexOf('表类型')>=0) return ioTable('all');
  var best=null, bestScore=0;
  IO_TABLES.forEach(function(T){
    if(T.all) return;
    var need=T.head.map(function(h){ return h.replace(/\s/g,''); });
    var hit=0;
    need.forEach(function(h){ if(H.indexOf(h)>=0) hit++; });
    if(hit!==need.length) return;                    /* 列不齐 → 不猜 */
    var score=hit*10 + (H[0]===need[0]?60:0);
    if(score>bestScore){ bestScore=score; best=T; }
  });
  return best;
}

function normalizeDB(d){

  });
  d.meta=d.meta||{};

  /* 项目起止时间（选填）—— 只做兜底，不写默认值，空就是空 */
  d.projects.forEach(function(p){ p.start=p.start||''; p.end=p.end||''; });
  d.logicNodes.forEach(function(n){ n.evidenceIds=n.evidenceIds||[]; n.hypothesisIds=n.hypothesisIds||[]; n.expIds=n.expIds||[]; n.litIds=n.litIds||[]; n.gap=n.gap||[]; if(n.stg==null) n.stg=null; });
  d.evidence.forEach(function(e){ e.conclusionIds=e.conclusionIds||[]; e.refuteConcIds=e.refuteConcIds||[]; e.hypothesisIds=e.hypothesisIds||[]; e.refuteHypIds=e.refuteHypIds||[]; e.nodeIds=e.nodeIds||[]; e.srcKey=(e.srcKey==null?'':e.srcKey); e.srcId=e.srcId||''; e.srcFrom=e.srcFrom||''; });
  /* 内容条目：fromDb=true 的是「绑定了工作台记录」的条目，标题/状态/日期一律取工作台实时值 */
  d.contents.forEach(function(c){ c.fromDb=!!c.fromDb; c.srcId=c.srcId||''; });
  d.conclusions.forEach(function(c){ c.evidenceIds=c.evidenceIds||[]; c.refuteIds=c.refuteIds||[]; });
  d.hypotheses.forEach(function(h){ h.supportIds=h.supportIds||[]; h.refuteIds=h.refuteIds||[]; h.next=h.next||[]; });
  return d;
}
/* 把一份数据包作为「新项目」追加：所有 id 加随机后缀，避免与现有数据冲突 */
function importPackage(obj){
  if(!obj||!obj.projects||!obj.projects.length) return null;
  var opid=obj.projects[0].id;
  var sfx='_'+Math.random().toString(36).slice(2,6);
  function rid(x){ return (typeof x==='string'&&x)?(x+sfx):x; }
  var proj=clone(obj.projects[0]);
  proj.id=rid(proj.id); proj.updated=TODAY;
  DB.projects.push(proj);
  var newPid=proj.id;
  var ARR=['evidenceIds','nodeIds','conclusionIds','hypothesisIds','refuteIds','refuteConcIds','refuteHypIds','expIds','litIds'];
  ['questions','logicNodes','conclusions','hypotheses','evidence','nextQuestions','contents'].forEach(function(k){
    (obj[k]||[]).forEach(function(row){
      if(row.projectId!==opid) return;
      var c=clone(row); c.id=rid(c.id); c.projectId=newPid;
      ARR.forEach(function(f){ if(c[f]&&c[f].map) c[f]=c[f].map(rid); });
      DB[k].push(c);
    });
  });
  (obj.logicEdges||[]).forEach(function(e){
    if(e.projectId!==opid) return;
    DB.logicEdges.push({ id:rid(e.id), projectId:newPid, from:rid(e.from), to:rid(e.to) });
  });
  return newPid;
}

    var obj=null;
    try{ obj=JSON.parse(text); }catch(e){ return {ok:false, msg:'JSON 解析失败（'+e.message+'）'}; }
    if(!obj || !obj.projects || !obj.projects.length) return {ok:false, msg:'这个 JSON 里没有 projects 字段，无法识别为科研总览数据包'};
    if(mode==='replace'){
      var d=normalizeDB(clone(obj));
      DB=d; persist(DB); draw();
      return {ok:true, msg:'已替换全部数据：'+DB.projects.length+' 个项目 / '+DB.logicNodes.length+' 个逻辑节点 / '+DB.evidence.length+' 条证据'};
    }
    var npid=importPackage(obj);
    if(!npid) return {ok:false, msg:'数据包里没有可用项目'};
    DB.meta.active=npid; persist(DB); draw();
    var np=byId(DB.projects,npid);
    return {ok:true, msg:'已作为新项目导入并切换过去：'+(np?np.name:'')};
  }
  var t=csvObjects(text);
  var T=detectTable(t.head);
  if(!T) return {ok:false, msg:'无法识别表类型。当前表头：'+(t.head.join(' / ')||'（空）')+'；请对照模板的列名'};
  /* 跳过以 # 开头的注释行 */
  var keep=t.rows.filter(function(o){ return !/^\s*#/.test(String(o[T.head[0]]||'')); });
  var skipped=t.rows.length-keep.length;
  var info=T.load(keep);
  save(); draw();
  return {ok:true, table:T.key, label:T.label, count:keep.length,
    msg:'「'+T.label+'」导入 '+keep.length+' 行 → '+info+(skipped?('（跳过注释行 '+skipped+'）'):'')};
}

function formProjDates(){

    '<button type="button" class="mini" data-quick="start-today">开始＝今天</button>'+
    '<button type="button" class="mini" data-quick="end-today">截止＝今天</button>'+

    '</div></div>';
  formWrap('起止时间 · '+p.name,
    '<label class="field"><span>开始时间</span><input id="d_start" type="date" value="'+esc(p.start||'')+'"></label>'+
    '<label class="field"><span>截止时间</span><input id="d_end" type="date" value="'+esc(p.end||'')+'"></label>'+
    quick+
    '<div class="field full"><div class="multi-hint">两项都能留空。只填开始时间也能用；两个都填时按自然日算总天数、已进行与剩余天数。截止早于开始会被拦下。</div></div>',
    function(b,close){
      var sI=b.querySelector('#d_start'), eI=b.querySelector('#d_end');
      function plusDays(ds, n){
        var d=new Date(Date.parse(ds+'T00:00:00Z')); d.setUTCDate(d.getUTCDate()+n);
        return d.toISOString().slice(0,10);
      }
      b.addEventListener('click', function(ev){
        var q=ev.target.closest ? ev.target.closest('[data-quick]') : null;
        if(!q) return;
        ev.preventDefault();
        var k=q.dataset.quick;
        if(k==='start-today') sI.value=TODAY;
        else if(k==='end-today') eI.value=TODAY;
        else if(k==='end-start90'){ if(sI.value) eI.value=plusDays(sI.value, 89); else toast('先填开始时间'); }
        else if(k==='clear'){ sI.value=''; eI.value=''; }
      });
      b.querySelector('[data-act="fsave"]').onclick=function(){
        var st=sI.value.trim(), en=eI.value.trim();
        if(st && en && en<st){ toast('截止时间不能早于开始时间'); return; }
        p.start=st; p.end=en; p.updated=TODAY;
        save(); close(); draw();
        toast('起止时间已更新');
      };
    });

/* 新节点默认接到哪里：
   - 指定了阶段 N（N≥2）：从「阶段 N-1」里挑最后一个节点当前驱
   - 指定为阶段 1：视为起点，不接前驱
   - 自动：接在最后一个节点后面 */
function autoConnect(nid, stg){
  var pid=DB.meta.active, lv=nodeLevels();
  var others=slice('logicNodes').filter(function(x){ return x.id!==nid; });
  if(!others.length) return;
  var target=null;
  if(stg!=null && +stg>1){
    var prev=others.filter(function(x){ return (lv[x.id]||0)+1 === +stg-1; })
                   .sort(function(a,b){ return a.order-b.order; });
    target = prev.length ? prev[prev.length-1] : null;
  } else if(stg!=null && +stg===1){
    target = null;
  } else {
    var ordered=others.slice().sort(function(a,b){ return a.order-b.order; });
    target = ordered[ordered.length-1];
  }
  if(target) DB.logicEdges.push({ id:uid(pid+'_e'), projectId:pid, from:target.id, to:nid });
}

/* 关联实验 / 文献 选择器：先选模块，再从工作台该模块的记录里勾（可跨模块累积）
   列的是工作台真实记录 —— 勾上即把该记录挂进本项目（srcId 外键），不记编号。
   本地补录的条目也留在下面，方便先把关系挂好、以后再迁移。 */
function formLink(nid){
  var n=byId(DB.logicNodes,nid); if(!n) return;
  reqIndex();
  var sel={};
  (n.expIds||[]).concat(n.litIds||[]).forEach(function(x){
    var c=byId(DB.contents,x);
    sel[c && c.fromDb ? ('db:'+c.modKey+':'+c.srcId) : ('local:'+x)] = 1;
  });
  var curMod='exp';
  var MODS = SRC_MODULES.filter(function(m){ return !!m.k; });
  function tabsHTML(){
    return '<div class="modtabs">'+MODS.map(function(m){
      return '<button type="button" class="modtab'+(m.k===curMod?' on':'')+'" data-act="lnkmod" data-mod="'+esc(m.k)+'">'+
        esc(m.n)+'<span class="n">'+depCount(m.k)+'</span></button>';
    }).join('')+'</div>';
  }
  function listHTML(){
    var items=depItems(curMod), local=contentsOf(curMod, n.projectId).filter(function(c){ return !c.fromDb; });
    var h='';
    if(items.length){
      h += '<div class="pick-grp">工作台记录 · 实时</div><div class="msel" style="max-height:200px">'+items.map(function(it){
        var v=pickVal(curMod,it), on=!!sel[v];
        return '<label class="pick-i'+(on?' on':'')+'"><input type="checkbox" value="'+esc(v)+'"'+(on?' checked':'')+'>'+
          '<span class="tt">'+esc(it.title)+'</span><span class="mk2">'+esc(it.state||'—')+'</span>'+
          '<span class="dt">'+esc(it.date||'')+'</span></label>';
      }).join('')+'</div>';
    }
    if(local.length){
      h += '<div class="pick-grp">本地补录</div><div class="msel" style="max-height:120px">'+local.map(function(c){
        var v='local:'+c.id, on=!!sel[v];
        return '<label class="pick-i'+(on?' on':'')+'"><input type="checkbox" value="'+esc(v)+'"'+(on?' checked':'')+'>'+
          '<span class="tt">'+esc(cardLabel(c))+'</span><span class="mk2">'+esc(c.status||'—')+'</span>'+
          '<span class="dt">'+esc(c.date||'')+'</span></label>';
      }).join('')+'</div>';
    }
    if(!h) h = '<div class="pick-empty">工作台「'+esc(srcLabel(curMod))+'」里还没有记录。'+(depReady()?'':'（未连接工作台）')+'</div>';
    return h;
  }
  function selLine(){
    var ids=Object.keys(sel), ex=0;
    ids.forEach(function(v){
      var p=parsePick(v); if(!p) return;
      var mk = p.from==='db' ? p.mod : ((byId(DB.contents,p.id)||{}).modKey);
      if(mk==='exp') ex++;
    });
    return '已选 <b>'+ids.length+'</b> 条（实验 '+ex+' · 其它模块 '+(ids.length-ex)+'）';
  }
  formWrap('关联实验 / 文献 · '+n.name,
    '<div class="field full"><span>第一步选模块，第二步从工作台该模块的记录里选（可跨模块累积）</span>'+

          srcId = card.id; srcFrom = 'db';
        } else if(pk && pk.from==='local'){
          srcId = pk.id; srcFrom = 'local';
          card = byId(DB.contents, srcId);
        }
        var srcTxt = mm ? srcLabel(mm) : '其他';
        var refTxt = card ? ctTitle(card) : freeTxt;
        /* 只保留属于 newPid 的对象，避免跨项目悬空引用 */
        var cns=onlyPid('conclusions',getMulti(b,'cn'),newPid),
            rcn=onlyPid('conclusions',getMulti(b,'rcn'),newPid),
            hys=onlyPid('hypotheses', getMulti(b,'hy'),newPid),
            rhy=onlyPid('hypotheses', getMulti(b,'rhy'),newPid),
            nds=onlyPid('logicNodes', getMulti(b,'nd'),newPid);
        if(id){
          var o=byId(DB.evidence,id);
          var oldPid=o.projectId;
          o.name=name; o.type=val(b,'f_type'); o.state=val(b,'f_state'); o.strength=val(b,'f_str');
          o.src=srcTxt; o.srcKey=mm; o.srcId=srcId||''; o.srcFrom=srcFrom; o.ref=refTxt;
          o.date=val(b,'f_date'); o.finding=val(b,'f_find');
          o.note=val(b,'f_note'); o.projectId=newPid; o.tags=[projTag(newPid)];
          o.conclusionIds=cns; o.refuteConcIds=rcn; o.hypothesisIds=hys; o.refuteHypIds=rhy; o.nodeIds=nds;
          /* 跨项目移动：把证据从「原项目节点」的 evidenceIds 里摘干净 */
          if(oldPid!==newPid) DB.logicNodes.forEach(function(n){
            n.evidenceIds=(n.evidenceIds||[]).filter(function(x){ return x!==id; });
          });
        } else {
          id=uid(newPid+'_ev');
          DB.evidence.push({ id:id, projectId:newPid, name:name, type:val(b,'f_type'), state:val(b,'f_state'),
            strength:val(b,'f_str'), src:srcTxt, srcKey:mm, srcId:srcId||'', srcFrom:srcFrom, ref:refTxt,
            date:val(b,'f_date'), finding:val(b,'f_find'), note:val(b,'f_note'), tags:[projTag(newPid)],
            conclusionIds:cns, refuteConcIds:rcn, hypothesisIds:hys, refuteHypIds:rhy, nodeIds:nds });
        }
        relinkEvidence(id);
        save(); close(); draw();
        toast(moved?('证据已移至 '+projTag(newPid)+'，并已切到该项目的结论 / 假设')
                    :'证据已保存，关联计数已双向同步');
      };
    });
}

function onAct(e){
  var t=e.target.closest('[data-act]');
  if(!t) return;
  var a=t.dataset.act, id=t.dataset.id;

  switch(a){
    case 'edit':
      state.edit=!state.edit;
      if(!state.edit) closeDrawer();
      draw(); toast(state.edit?'已进入维护模式 · 可以增删改本页的研究逻辑':'已退出维护模式，恢复干净视图'); return;
    case 'note': formNote(); return;
    case 'view': state.view=t.dataset.v; draw(); return;
    /* ---- 多选控件：全选 / 清空（原生 select 无法一键全选） ---- */
    case 'mselall': case 'mselnone': {
      var box=document.querySelector('.msel[data-msel="'+(t.dataset.key||'')+'"]');
      if(box){
        Array.prototype.slice.call(box.querySelectorAll('input[type=checkbox]')).forEach(function(i){
          i.checked = (a==='mselall');
        });
        refreshMsel(box);
      }
      return;
    }
    /* ---- 关联实验 / 文献（节点 ↔ 原模块记录，真实外键） ---- */
    case 'linknode': closeDrawer(); formLink(id); return;
    case 'unlinkref': {
      var nR=byId(DB.logicNodes,t.dataset.id); if(!nR) return;
      var rid=t.dataset.ref;
      nR.expIds=(nR.expIds||[]).filter(function(x){ return x!==rid; });
      nR.litIds=(nR.litIds||[]).filter(function(x){ return x!==rid; });
      save(); draw();
      if(document.getElementById('roDrawer').classList.contains('open')) openNode(nR.id);
      toast('已解除关联（原记录没有被删除）'); return;
    }
    case 'stat': openStat(t.dataset.s); return;
    case 'node': openNode(id); return;
    case 'emnode':
      var i=state.expanded.indexOf(id);
      if(i>=0) state.expanded.splice(i,1); else state.expanded.push(id);
      draw(); return;
    case 'closedrawer': closeDrawer(); return;
    case 'closemodal': closeModal(); return;
    case 'conc': openConc(id); return;
    case 'hyp':  openHyp(id); return;
    case 'ev':   openEvidence(id); return;
    case 'evfilter': state.evFilter=t.dataset.t; draw(); return;
    case 'opensrc': {
      /* 证据详情的「打开原记录」：跳到工作台里那条记录 */
      var ev=byId(DB.evidence,id); if(!ev) return;
      var evC = ev.srcId? byId(DB.contents, ev.srcId) : null;
      if(evC){ openContent(evC); return; }
      var evIt = depItem(ev.srcKey||'', ev.srcId||'');
      if(evIt){ openInWorkbench(ev.srcKey, ev.srcId, evIt.title); return; }
      if(!ev.srcId && ev.ref){
        toast('这条来源是手填的（'+srcLabel(ev.srcKey||'')+' · '+ev.ref+'）：工作台里没有对应记录');
        return;
      }
      toast('工作台里已经没有这条记录了（'+(srcLabel(ev.srcKey||'')||'原模块')+'）');
      return;
    }
    case 'openct': openContent(byId(DB.contents,id)); return;
    /* ---- 全部内容：维护模式下的增删改 + 与工作台核对 ---- */
    case 'addct': formContent(null); return;
    case 'editct': formContent(id); return;
    case 'bindct': formBindContent(id); return;
    case 'delct': {
      var cD=byId(DB.contents,id); if(!cD) return;
      var isB=ctBound(cD);
      if(!confirm('从本项目移除「'+ctTitle(cD)+'」？\n\n'+(isB
        ? '只会解除项目与这条工作台记录的关联，工作台里的原记录不会被删除。'
        : '这是一条本地补录的内容，移除后就只剩 JSON 备份里还有。'))) return;
      /* 连带把指向它的证据 / 节点关联清掉，避免悬空外键 */
      DB.contents=DB.contents.filter(function(x){ return x.id!==id; });
      DB.evidence.forEach(function(e){ if(e.srcId===id){ e.srcId=''; e.ref=''; } });
      DB.logicNodes.forEach(function(n){
        n.expIds=(n.expIds||[]).filter(function(x){ return x!==id; });
        n.litIds=(n.litIds||[]).filter(function(x){ return x!==id; });
      });
      save(); draw(); toast(isB? '已解除关联（工作台原记录未动）' : '已移除本地补录条目');
      return;
    }
    case 'addfromdb': formAddFromDb(); return;
    case 'syncct': {
      /* 与工作台核对：① 绑定条目按工作台刷新快照 ② 本地补录里「模块 + 标题」
         与工作台记录同名的，自动认领过来（迁移用），不重复绑定 */
      var pid0=DB.meta.active, bindN=0, goneN=0, autoN=0;
      DB.contents.forEach(function(c){
        if(c.projectId!==pid0) return;
        if(ctBound(c)){
          var live=ctLive(c);
          if(live){ c.title=live.title; c.status=live.state; c.date=live.date; bindN++; }
          else goneN++;
          return;
        }
        if(!c.title || !c.modKey) return;
        var hit = depItems(c.modKey).filter(function(it){ return it.title===c.title; })[0];
        if(!hit) return;
        var taken = DB.contents.some(function(x){
          return x!==c && x.fromDb && x.modKey===c.modKey && x.srcId===hit.id; });
        if(taken) return;
        c.srcId=hit.id; c.fromDb=true; c.status=hit.state; c.date=hit.date; autoN++;
      });
      save(); draw();
      toast('已与工作台核对：'+bindN+' 条绑定记录按工作台刷新'+
            (autoN? ('；'+autoN+' 条本地补录认领了同名的工作台记录'):'') +
            (goneN? ('；'+goneN+' 条在工作台里已删除，标为「工作台已删除」'):''));
      return;
    }
    case 'nodeev': case 'nqev': {
      if(a==='nodeev'){ var n=byId(DB.logicNodes,id); if(n){ state.evFilter='全部'; state.view='overview'; closeDrawer(); draw(); toast('已在「关键证据」中列出该环节的全部证据'); } }
      else { var q=byId(DB.nextQuestions,id); if(q){ state.evFilter='全部'; closeDrawer(); draw(); toast('已定位到相关证据：'+(q.missing&&q.missing.length?q.missing.join('、'):'全部类型')); } }
      return;
    }
    case 'nqadd':
      /* 「添加验证」= 去工作台建一条实验记录。科研总览不能替工作台写记录，所以直接把人送过去 */
      hostPost({type:'ciib-ro-goto', mod:'exp'});
      toast('已打开工作台「实验记录」：新建一条验证实验后，回到科研总览把它的证据挂到这个问题上');
      return;
    /* ---- 维护模式：项目 ---- */
    case 'newproj': formProject(null); return;
    case 'editproj': formProject(DB.meta.active); return;
    case 'editdates':
      if(!state.edit){ toast('点右上「✎ 维护模式」后即可修改起止时间'); return; }
      formProjDates(); return;
    case 'delproj':
      if(DB.projects.length<=1){ toast('至少保留一个项目'); return; }
      if(!confirm('删除项目「'+curP().name+'」？\n\n它的研究问题 / 逻辑节点 / 证据 / 结论 / 假设 / 内容清单会一并删除，不可撤销。工作台里的记录不受影响。')) return;
      (function(){
        var pid=DB.meta.active;
        DB.projects=DB.projects.filter(function(x){ return x.id!==pid; });
        ['questions','logicNodes','logicEdges','conclusions','hypotheses','evidence','nextQuestions','contents'].forEach(function(k){
          DB[k]=DB[k].filter(function(x){ return x.projectId!==pid; });
        });
        DB.meta.active=DB.projects[0].id;
        save(); draw(); toast('项目已删除');
      })();
      return;
    /* ---- 节点 / 结论 / 假设 / 证据 / 问题 ---- */
    /* ---- 阶段（并行）手动调整 ---- */
    case 'stginc': case 'stgdec': case 'stgauto': {
      var nS=byId(DB.logicNodes,id); if(!nS) return;
      var cur=(nodeLevels()[nS.id]||0)+1;
      if(a==='stgauto'){ nS.stg=null; }
      else {
        var nx = cur + (a==='stginc'?1:-1);
        if(a==='stgdec' && nx<1){ toast('已经是第 1 阶段了'); return; }
        if(nx>60) nx=60;
        nS.stg = nx;
      }
      save(); draw();
      if(document.getElementById('roDrawer').classList.contains('open')) openNode(id);
      toast(a==='stgauto'
        ? ('已恢复自动推导（当前阶段 '+((nodeLevels()[nS.id]||0)+1)+'）')
        : ('阶段已'+(a==='stginc'?'推后':'提前')+'为 '+nS.stg+'（手动指定，不再被上游推动）'));
      return;
    }
    case 'addnodeat': formNode(null, parseInt(t.dataset.lv,10)||null); return;
    /* ---- 导入 / 导出 ---- */
    case 'io': openIO(); return;
    case 'ioexpdb':
      downloadText('ciib-科研总览-全部数据-'+TODAY+'.json', JSON.stringify(DB,null,2), 'application/json');
      toast('已导出全部数据（JSON 备份）'); return;
    case 'ioexpproj': {
      var cP=curP(); if(!cP){ toast('还没有项目，先新建一个'); return; }
      downloadText('ciib-科研总览-'+cP.name+'-'+TODAY+'.json', JSON.stringify(projectPack(),null,2), 'application/json');
      toast('已导出当前项目（JSON 数据包）'); return;
    }
    case 'ioexpcsv': {
      var cC=curP(); if(!cC){ toast('还没有项目，先新建一个'); return; }
      var ke=t.dataset.k || (document.getElementById('ioExpT')||{}).value;
      var T1=ioTable(ke); if(!T1) return;
      downloadText(T1.file+'-'+cC.name+'-'+TODAY+'.csv', '\ufeff'+toCSV(T1.head, T1.dump()), 'text/csv');
      toast('已导出「'+T1.label+'」CSV'); return;
    }
    case 'iotmpl': {
      var kt=t.dataset.k || (document.getElementById('ioTplT')||{}).value;
      var T2=ioTable(kt); if(!T2) return;
      downloadText('模板-'+T2.file+'.csv', '\ufeff'+toCSV(T2.head, T2.demo||[]), 'text/csv');
      toast('已下载「'+T2.label+'」模板（含 '+((T2.demo||[]).length)+' 行示例）'); return;
    }
    case 'iocancel': {
      var pv=document.getElementById('ioPrev'); if(pv) pv.innerHTML='';
      pendingImport=null; return;
    }
    case 'iodocsv': {
      if(!requireEdit()) return;
      if(!pendingImport || pendingImport.kind!=='csv') return;
      var r1=applyImport(pendingImport.text, 'x.csv');
      if(r1.ok){ save(); closeModal(); draw(); toast('导入完成：'+r1.msg); }
      else toast('导入失败：'+r1.msg);
      pendingImport=null; return;
    }
    case 'iodojson': {
      if(!requireEdit()) return;
      if(!pendingImport || pendingImport.kind!=='json') return;
      var r2=applyImport(pendingImport.text, 'x.json', t.dataset.mode);
      if(r2.ok){ closeModal(); draw(); toast(r2.msg); }
      else toast('导入失败：'+r2.msg);
      pendingImport=null; return;
    }
    case 'addnode': formNode(null); return;
    case 'editnode': closeDrawer(); formNode(id); return;
    case 'delnode':
      if(!confirm('删除该逻辑节点？')) return;
      DB.logicNodes=DB.logicNodes.filter(function(x){ return x.id!==id; });
      DB.logicEdges=DB.logicEdges.filter(function(x){ return x.from!==id && x.to!==id; });
      DB.evidence.forEach(function(ev){ ev.nodeIds=ev.nodeIds.filter(function(x){ return x!==id; }); });
      save(); draw(); toast('节点已删除'); return;
    case 'addconc': formConc(null); return;
    case 'editconc': closeDrawer(); formConc(id); return;
    case 'delconc':
      if(!confirm('删除该结论？')) return;
      DB.conclusions=DB.conclusions.filter(function(x){ return x.id!==id; });
      DB.evidence.forEach(function(ev){
        ev.conclusionIds=(ev.conclusionIds||[]).filter(function(x){ return x!==id; });
        ev.refuteConcIds=(ev.refuteConcIds||[]).filter(function(x){ return x!==id; });   /* 只解关系，证据本身保留 */
      });
      save(); draw(); toast('结论已删除（证据保留，仅解除关联）'); return;
    case 'addhyp': formHyp(null); return;
    case 'edithyp': closeDrawer(); formHyp(id); return;
    case 'delhyp':
      if(!confirm('删除该假设？')) return;
      DB.hypotheses=DB.hypotheses.filter(function(x){ return x.id!==id; });
      DB.evidence.forEach(function(ev){
        ev.hypothesisIds=(ev.hypothesisIds||[]).filter(function(x){ return x!==id; });
        ev.refuteHypIds=(ev.refuteHypIds||[]).filter(function(x){ return x!==id; });     /* 只解关系，证据本身保留 */
      });
      DB.logicNodes.forEach(function(n){ n.hypothesisIds=n.hypothesisIds.filter(function(x){ return x!==id; }); });
      DB.nextQuestions.forEach(function(q){ q.hypothesisIds=q.hypothesisIds.filter(function(x){ return x!==id; }); });
      save(); draw(); toast('假设已删除（证据保留，仅解除关联）'); return;
    case 'addev': formEv(null); return;
    case 'editev': closeModal(); closeDrawer(); formEv(id); return;
    case 'delev':
      if(!confirm('删除该证据？此操作会同时解除它在结论与节点上的关联。')) return;
      DB.evidence=DB.evidence.filter(function(x){ return x.id!==id; });
      DB.conclusions.forEach(function(c){ c.evidenceIds=c.evidenceIds.filter(function(x){ return x!==id; }); c.refuteIds=c.refuteIds.filter(function(x){ return x!==id; }); });
      DB.logicNodes.forEach(function(n){ n.evidenceIds=n.evidenceIds.filter(function(x){ return x!==id; }); });
      DB.hypotheses.forEach(function(h){ h.supportIds=h.supportIds.filter(function(x){ return x!==id; }); h.refuteIds=h.refuteIds.filter(function(x){ return x!==id; }); });
      save(); draw(); toast('证据已删除，关联计数已同步'); return;
    case 'addnq': formNq(null); return;
    case 'editnq': closeDrawer(); formNq(id); return;
    case 'delnq':
      if(!confirm('删除该问题？')) return;
      DB.nextQuestions=DB.nextQuestions.filter(function(x){ return x.id!==id; });
      save(); draw(); toast('问题已删除'); return;
    case 'doneq': {
      var q=byId(DB.nextQuestions,id); if(!q) return;
      q.done=!q.done; save(); draw(); toast(q.done?'已标记完成':'已恢复为待处理'); return;
    }
    case 'addq': formQuestionsManager(); return;
    case 'editq': formQuestionsManager(); return;
    case 'reset':
      if(!confirm('清空科研总览的全部数据？\n\n当前 '+DB.projects.length+' 个项目，以及它们的研究问题 / 逻辑节点 / 证据 / 结论 / 假设 / 内容会被全部删除，不可撤销。\n建议先用「全部数据（JSON 备份）」导出一份。')) return;
      DB = clone(DB_EMPTY); state.expanded=[]; state.evFilter='全部'; state.view='overview';
      persist(DB); closeModal(); draw(); toast('已清空全部数据'); return;
  }
}

function onChange(e){
  var el=e.target;
  /* 多选勾选框：刷新「已选 N / 总数」与高亮 */
  if(el && el.matches && el.matches('.msel input[type=checkbox]')) refreshMsel(el.closest('.msel'));
  /* 项目标签单选：刷新胶囊高亮 */
  if(el && el.matches && el.matches('.radios input[type=radio]')){
    Array.prototype.slice.call(el.closest('.radios').querySelectorAll('label')).forEach(function(l){
      var i=l.querySelector('input'); l.classList.toggle('on', !!(i&&i.checked));
    });
  }
  var t=e.target.closest('[data-act]');
  if(!t) return;
  if(t.dataset.act==='projsel'){
    /* 下拉里的「＋ 新建项目…」：回到当前项目再开新建表单，避免选了个不存在的值 */
    if(t.value==='__new'){ t.value=DB.meta.active||''; formProject(null); return; }
    DB.meta.active=t.value; state.expanded=[]; state.evFilter='全部'; persist(DB); draw(); return;
  }
  if(t.dataset.act==='ctsel'){ state.ct[t.dataset.k]=t.value; draw(); return; }
}

/* ==========================================================================
   启动
   ========================================================================== */
DB = loadDB();
(function mount(){
  initTheme();
  var ro=document.getElementById('ro');
  ro.innerHTML = topHTML() + '<main class="ro-view" id="roView"></main>';
  document.addEventListener('click', onAct);
  document.addEventListener('change', onChange);
  draw();
  reqIndex();     /* 嵌入工作台时，把工作台各模块的真实记录拉过来 */
})();

/* 便于人工检查：把关键结构挂到 window（只读用途，不影响功能） */
window.CIIB_RO = {
  db:function(){ return DB; }, state:state, key:LS_KEY,
  uniqTypes:uniqTypes, sec5:sec5, sec2:sec2, sec1:sec1,
  /* 阶段 / 并行 */
  nodeLevels:nodeLevels, dagColumns:dagColumns, maxStage:maxStage, nodeAuto:nodeAuto,
  /* 模块优先选择器 / 配色 */
  SRC_MODULES:SRC_MODULES, contentsOf:contentsOf, cardLabel:cardLabel, modName:modName,
  srcLabel:srcLabel, srcModKeyOf:srcModKeyOf, evSrcText:evSrcText, evRefTitle:evRefTitle,
  carryRefs:carryRefs, evRefHTML:evRefHTML,
  setTheme:setTheme, embedded:EMBEDDED,
  /* 工作台索引（只读）与绑定关系 */
  dep:function(){ return RODEP; }, depItems:depItems, depItem:depItem, depReady:depReady, depCount:depCount,
  pickVal:pickVal, parsePick:parsePick, ensureContent:ensureContent, dbPickList:dbPickList,
  ctBound:ctBound, ctTitle:ctTitle, ctState:ctState, ctDate:ctDate, ctGone:ctGone,
  evCanOpen:evCanOpen, evSrcFlag:evSrcFlag, openContent:openContent,
  /* 测试用：直接塞一份工作台索引（等价于主站 postMessage 推过来的那份） */
  setDep:function(mods){ RODEP.ok=true; RODEP.modules=mods||[]; draw(); },
  /* 完成态沉底 */
  sinkDone:sinkDone, sinkBy:sinkBy, DONE_OF:DONE_OF,
  /* 导入 / 导出（供测试直接调用，等价于点面板里的按钮） */
  tables:function(){ return IO_TABLES.map(function(t){ return t.key; }); },
  toCSV:toCSV, parseCSV:parseCSV, detectTable:function(h){ var T=detectTable(h); return T?T.key:null; },
  tmpl:function(k){ var T=ioTable(k); return T?toCSV(T.head, T.demo):''; },
  exportTable:function(k){ var T=ioTable(k); return T?toCSV(T.head, T.dump()):''; },
  exportProject:function(){ return JSON.stringify(projectPack()); },
  exportAll:function(){ return JSON.stringify(DB); },
  importText:function(text,name,mode){ return applyImport(text,name,mode); }
};

})();
</script>
